<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Для корректного отображения на мобильных экранах WP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>WN/OLD STORE — Добро пожаловать</title>
    
    <!-- Иконки (оставляем как было) -->
    <link rel="icon" type="image/png" href="avatar.png">
    <link rel="apple-touch-icon" href="avatar.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* Базовые настройки для стиля Windows Phone */
        body { 
            background-color: #2b2b2b; /* Тёмно-серый фон вместо чёрного для контраста */
            background-image: url('wp_bg.jpg'); 
            background-size: cover; 
            background-position: center; 
            color: #ffffff; 
            font-family: 'Segoe WP', 'Segoe UI', 'Segoe UI Symbol', sans-serif; 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Центрируем главный блок */
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Контейнер в стиле "Hub" или главного экрана */
        .content-wrap {
            width: 90%;
            max-width: 400px; /* Ограничение ширины как на экране телефона */
            text-align: center;
            z-index: 10;
        }
        
        /* Аватарка в стиле иконки приложения WP */
        .welcome-avatar {
            width: 120px; 
            height: 120px;
            border-radius: 20px; /* Квадратные углы с легким скруглением, как у плиток */
            object-fit: cover;
            border: 4px solid #ffffff; /* Белая рамка как у иконок на тёмном фоне */
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Заголовок: крупный, тонкий, без засечек */
        .welcome-title {
            color: #ffffff; 
            font-size: 28px;
            font-weight: 300; /* Light начертание — фишка Segoe WP */
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            text-transform: uppercase; /* В стиле заголовков WP */
        }

        /* Подзаголовок: мелкий, серый, поясняющий */
        .welcome-text {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.4;
            margin-top: 5px;
            max-width: 320px;
        }

        /* Отступ для кнопки */
        .spacer-large {
            height: 60px;
        }

        /* Кнопка-плитка в стиле Windows Phone */
        .enter-btn {
            display: block;
            width: 100%;
            background-color: #d8107a; /* Акцентный цвет (Magenta) */
            color: #ffffff;
            border: none;
            padding: 20px 0; /* Высокая кнопка */
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s ease;
            
            /* Тень в стиле WP: не размытая, а смещенная */
            box-shadow: 0 4px 6px rgba(0,0,0,0.4); 
        }
        .enter-btn:active {
            background-color: #a00c5a; /* Затемнение при нажатии */
            transform: scale(0.98); /* Лёгкое уменьшение */
        }

        /* Футер: мелкий текст внизу */
        .welcome-footer {
            margin-top: 40px;
            color: #666666; 
            font-size: 11px;
            text-align: center;
            line-height: 1.5;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="content-wrap">
        <!-- Верхняя часть: логотип и описание -->
        <div class="welcome-top">
            <img src="avatar.png" alt="Logo Large" class="welcome-avatar" onerror="this.style.display='none'">
            <h1 class="welcome-title">WN/OLD STORE</h1>
            <p class="welcome-text">Добро пожаловать в магазин приложений для WP 8.1 и WM 10</p>
        </div>

        <div class="spacer-large"></div>

        <!-- Центральная часть: плашка перехода (плитка) -->
        <a href="menu.html" class="enter-btn">Перейти в меню</a>

        <!-- Нижняя часть: мелкие копирайты -->
        <div class="welcome-footer">
            ©Все права защищены<br>
            WriskNuk Corporation<br>
            2026
        </div>
    </div>

    <!-- Скрипт активации PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker успешно зарегистрирован');
                }, function(err) {
                    console.log('Ошибка регистрации ServiceWorker: ', err);
                });
            });
        }
    </script>

</body>
</html>
