<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WN/OLD STORE — Добро пожаловать</title>
    <link rel="icon" type="image/png" href="avatar.png">

    <style>
        :root {
            --bg-color: #0f0f11;
            --text-color: #ffffff;
            --card-bg: #1a1a1d;
            --sub-color: #b0b0b5;
            --win-purple: #5133ab;
            --hover-purple: #6b4bbf;
        }
        [data-theme="light"] {
            --bg-color: #f5f7fa;
            --text-color: #111114;
            --card-bg: #ffffff;
            --sub-color: #55555a;
            --win-purple: #42298d;
            --hover-purple: #583db6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 16px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s; 
        }

        .page-container {
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        .avatar-wrapper {
            margin-bottom: 24px;
        }

        .welcome-avatar {
            width: 110px; 
            height: 110px;
            border-radius: 12px;
            object-fit: cover;
            border: 4px solid var(--win-purple);
            box-shadow: 0 8px 24px rgba(81, 51, 171, 0.25);
        }

        .header-group {
            margin-bottom: 32px;
        }

        .welcome-title {
            color: var(--win-purple); 
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.1;
        }

        .welcome-text {
            color: var(--sub-color);
            font-size: 15px;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        .enter-btn {
            display: block;
            width: 100%;
            background-color: var(--win-purple);
            color: white;
            text-decoration: none;
            padding: 18px 0;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 16px rgba(81, 51, 171, 0.2);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .enter-btn:hover {
            background-color: var(--hover-purple);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(81, 51, 171, 0.3);
        }
        .enter-btn:active {
            transform: scale(0.98);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid var(--sub-color);
            color: var(--text-color);
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .theme-toggle-btn:hover {
            border-color: var(--win-purple);
            color: var(--win-purple);
            background: rgba(81, 51, 171, 0.08);
        }
        .icon-box { font-size: 18px; line-height: 0; }

        .footer-block {
            margin-top: 36px;
            color: var(--sub-color);
            font-size: 12px;
            line-height: 1.4;
            opacity: 0.9;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
            text-align: center;
        }
    </style>

    <script>
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);

        function updateThemeButton() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const toggleBtn = document.getElementById('themeToggle');
            if (!toggleBtn) return;
            const iconSpan = toggleBtn.querySelector('.icon-box');
            iconSpan.textContent = isDark ? '☀️' : '🌙';
        }
        updateThemeButton();

        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('themeToggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    let theme = document.documentElement.getAttribute('data-theme');
                    let newTheme = theme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    updateThemeButton();
                });
            }
        });
    </script>
</head>
<body>
    <div class="page-container">
        <div class="avatar-wrapper">
            <img src="avatar.png" alt="Логотип магазина" class="welcome-avatar" onerror="this.style.display='none'">
        </div>

        <div class="header-group">
            <h1 class="welcome-title">WN/OLD STORE</h1>
            <p class="welcome-text">Добро пожаловать в магазин приложений для WP 8.1 и WM 10</p>
        </div>

        <a href="menu.html" class="enter-btn">Перейти в меню</a>

        <div class="controls-row">
            <button class="theme-toggle-btn" id="themeToggle" aria-label="Переключить тему">
                <span class="icon-box">🌙</span>
                <span>Тема</span>
            </button>
        </div>

        <div class="footer-block">
            © Все права защищены<br>
            WriskNuk Corporation<br>
            2026
        </div>
    </div>
</body>
</html>
