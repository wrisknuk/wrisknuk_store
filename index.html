<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP & WM10 Archive</title>
    <link rel="icon" type="image/jpeg" href="avatar.jpg">
    <link rel="apple-touch-icon" href="avatar.jpg">
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --sub-color: #aaaaaa;
            --border-color: #5133ab;
            --info-bg: #111111;
        }
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #000000;
            --sub-color: #555555;
            --border-color: #5133ab;
            --info-bg: #f3f3f3;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', 'Segoe UI WP', sans-serif; margin: 12px; transition: background 0.2s, color 0.2s; }
        
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .shop-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }
        h1 { color: #5133ab; font-weight: 300; font-size: 20px; margin: 0; }
        
        .theme-btn { background: #5133ab; border: 2px solid transparent; color: white; padding: 5px 12px; cursor: pointer; font-family: 'Segoe UI'; font-size: 12px; font-weight: 600; }
        .theme-btn:active { background: #3f2687; }

        .subtitle { color: var(--sub-color); font-size: 13px; margin-bottom: 15px; margin-top: 8px; line-height: 1.4; }
        
        .grid { display: flex; flex-wrap: wrap; margin-left: -5px; margin-right: -5px; margin-bottom: 20px; }
        
        .tile { 
            background-color: #5133ab; 
            padding: 10px; 
            margin: 5px;
            width: calc(50% - 10px); 
            height: 115px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            text-decoration: none; 
            color: white; 
            box-sizing: border-box; 
        }
        .tile:active { opacity: 0.8; }
        .tile-title { font-size: 14px; font-weight: 600; }
        .tile-os { font-size: 10px; opacity: 0.7; text-align: right; }
        
        .tile-tg { background-color: #229ED9; }
        .tile-yt { background-color: #FF0000; }
        .icon { width: 24px; height: 24px; fill: white; margin-top: 5px; }

        .info-box { background-color: var(--info-bg); border-left: 4px solid #5133ab; padding: 12px; margin-top: 25px; box-sizing: border-box; }
        .info-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; line-height: 1.4; }
        .info-links a { color: #5133ab; text-decoration: none; margin-right: 15px; font-size: 13px; font-weight: bold; }

        @media (min-width: 600px) {
            .tile { width: 125px; height: 125px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <img src="avatar.jpg" alt="Logo" class="shop-avatar" onerror="this.style.display='none'">
            <h1>Каталог wrisknuk_store</h1>
        </div>
        <button class="theme-btn" id="themeToggle">Тема</button>
    </div>
    
    <div class="subtitle">Добро пожаловать. Выберите раздел или перейдите в наши соцсети:</div>

    <div class="grid">
        <a href="apps.html" class="tile">
            <div class="tile-title">Программы</div>
            <div class="tile-os">XAP / APPX</div>
        </a>

        <a href="games.html" class="tile">
            <div class="tile-title">Игры</div>
            <div class="tile-os">XAP / APPX</div>
        </a>

        <!-- Жесткая прямая ссылка для Telegram, понятная старым браузерам -->
        <a href="https://telegram.me" target="_blank" class="tile tile-tg">
            <div class="tile-title">Наш Telegram</div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-1-.65-.35-1 .22-1.62.15-.15 2.73-2.5 2.78-2.72.01-.03.01-.13-.05-.18-.06-.05-.15-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.37.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        </a>

        <!-- Старый текстовый формат ссылки YouTube, который 100% откроет именно ваш канал -->
        <a href="https://youtube.com" target="_blank" class="tile tile-yt">
            <div class="tile-title">YouTube канал</div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>

        <a href="howto.html" class="tile">
            <div class="tile-title">Инструкции</div>
            <div class="tile-os">Как ставить</div>
        </a>
    </div>

    <!-- Исправленный нижний инфо-блок -->
    <div class="info-box">
        <div class="info-title">Разработано wrisknuk_company в поддержку виндовс мобайл</div>
        <div class="info-links">
            <a href="https://telegram.me" target="_blank">Наш Telegram</a>
            <a href="https://youtube.com" target="_blank">Наш YouTube</a>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);

        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
