<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WN/OLD STORE — Добро пожаловать</title>
    <link rel="icon" type="image/png" href="avatar.png">
    <link rel="stylesheet" href="style.css">

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function syncThemeBtn() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.querySelector('#themeToggle .icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        document.addEventListener('DOMContentLoaded', () => {
            syncThemeBtn();
            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                syncThemeBtn();
            });
        });
    </script>
</head>
<body class="welcome-page">
    <main class="welcome-card">
        <img src="avatar.png" alt="Аватар WN/OLD STORE" class="welcome-avatar" onerror="this.style.display='none'">

        <h1 class="welcome-title">WN/OLD STORE</h1>
        <p class="welcome-subtitle">Магазин приложений и игр для Windows Phone 8.1 и Windows 10 Mobile</p>

        <a href="menu.html" class="enter-btn">Перейти в меню</a>

        <div class="controls">
            <button class="theme-btn" id="themeToggle" type="button">
                <span class="icon">🌙</span>
                <span>Тема</span>
            </button>
        </div>

        <footer class="welcome-footer">
            © Все права защищены<br>
            WriskNuk Corporation • 2026
        </footer>
    </main>
</body>
</html>
