<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню — WN/OLD STORE</title>
    <link rel="icon" type="image/png" href="avatar.png">

    <style>
        :root {
            --text: #ffffff;
            --muted: #c8c8d0;
            --accent: #5133ab;
            --accent-hover: #6b4bbf;
            --tile-bg: rgba(18, 18, 22, 0.86);
            --sheet-bg: rgba(12, 12, 16, 0.96);
            --border: rgba(255, 255, 255, 0.16);
            --overlay: rgba(10, 10, 14, 0.72);
        }
        [data-theme="light"] {
            --text: #111114;
            --muted: #45454d;
            --accent: #42298d;
            --accent-hover: #583db6;
            --tile-bg: rgba(255, 255, 255, 0.9);
            --sheet-bg: rgba(244, 246, 250, 0.97);
            --border: rgba(0, 0, 0, 0.14);
            --overlay: rgba(242, 244, 248, 0.78);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            padding: 16px;
            background:
                linear-gradient(var(--overlay), var(--overlay)),
                url("wp_bg.jpg") center / cover no-repeat fixed;
        }

        body.modal-open {
            overflow: hidden;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: var(--tile-bg);
            border: 1px solid var(--border);
            padding: 10px 14px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }

        .brand-avatar {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--muted);
        }

        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
        }
        .theme-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .page-title {
            font-size: 30px;
            font-weight: 300;
            text-transform: lowercase;
            margin-bottom: 14px;
        }

        /* Сетка плиток меню WM10 */
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .tile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 112px;
            padding: 14px;
            text-align: left;
            text-decoration: none;
            color: #ffffff;
            background: var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.14);
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .tile:hover { background: var(--accent-hover); }
        .tile:active { transform: scale(0.98); }

        .tile.tile-wide {
            grid-column: span 2;
            min-height: 92px;
        }

        .tile.tile-dark {
            background: var(--tile-bg);
            color: var(--text);
            border-color: var(--border);
        }
        .tile.tile-dark:hover { border-color: var(--accent); }

        .tile-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .tile-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .tile-badge {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        .tile-name {
            font-size: 17px;
            font-weight: 600;
            margin-top: 10px;
        }

        .tile-desc {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .footer {
            background: var(--tile-bg);
            border: 1px solid var(--border);
            padding: 12px 14px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        /* Полноэкранный слой поверх меню */
        .catalog-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--sheet-bg);
            overflow-y: auto;
            padding: 16px;
            display: none;
        }

        .catalog-overlay.open {
            display: block;
        }

        .overlay-inner {
            max-width: 960px;
            margin: 0 auto;
        }

        .overlay-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .overlay-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .overlay-title {
            font-size: 28px;
            font-weight: 300;
            text-transform: lowercase;
        }

        .close-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover { background: var(--accent-hover); }
        .close-btn:active { transform: scale(0.96); }

        /* Карточки внутри оверлея */
        .apps-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            padding-bottom: 24px;
        }

        .app-card {
            background: var(--tile-bg);
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .app-card:hover { border-color: var(--accent); }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
        }

        .app-os {
            background: var(--accent);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 7px;
            white-space: nowrap;
        }

        .app-desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.45;
            flex: 1;
            margin-bottom: 12px;
        }

        .app-method {
            font-size: 12px;
            color: var(--muted);
            padding-top: 10px;
            margin-bottom: 12px;
            border-top: 1px solid var(--border);
        }

        .download-btn {
            display: block;
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
        }
        .download-btn:hover { background: var(--accent-hover); }

        .empty-msg {
            background: var(--tile-bg);
            border: 1px solid var(--border);
            padding: 16px;
            color: var(--muted);
        }
    </style>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        let storeCache = null;

        function syncThemeBtn() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.querySelector('#themeToggle .icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        function esc(s = '') {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function getStoreData() {
            if (storeCache) return storeCache;
            const res = await fetch('store.json', { cache: 'no-store' });
            storeCache = await res.json();
            return storeCache;
        }

        async function openCategory(catId, catName) {
            const overlay = document.getElementById('catalogOverlay');
            const title = document.getElementById('overlayTitle');
            const list = document.getElementById('appsList');

            title.textContent = catName.toLowerCase();
            list.innerHTML = '<div class="empty-msg">Загрузка...</div>';

            overlay.classList.add('open');
            overlay.scrollTop = 0;
            document.body.classList.add('modal-open');

            try {
                const data = await getStoreData();
                const items = (data.apps || []).filter(app =>
                    catId === 'all' || app.category === catId
                );

                if (!items.length) {
                    list.innerHTML = '<div class="empty-msg">В этом разделе пока нет файлов.</div>';
                    return;
                }

                list.innerHTML = items.map(app => {
                    const ext = app.fileType || (String(app.downloadUrl).endsWith('.xap') ? 'xap' : 'appx');
                    return `
                        <article class="app-card">
                            <div class="app-header">
                                <div class="app-title">${esc(app.name)}</div>
                                <div class="app-os">${esc(app.platform)}</div>
                            </div>
                            <div class="app-desc">${esc(app.desc)}</div>
                            <div class="app-method">⚙ ${esc(app.method)}</div>
                            <a href="${esc(app.downloadUrl)}" class="download-btn" target="_blank" rel="noopener">
                                Скачать ${esc(ext)}
                            </a>
                        </article>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-msg">Ошибка загрузки store.json</div>';
            }
        }

        function closeCategory() {
            const overlay = document.getElementById('catalogOverlay');
            overlay.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        document.addEventListener('DOMContentLoaded', () => {
            syncThemeBtn();

            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                syncThemeBtn();
            });

            document.querySelectorAll('[data-cat]').forEach(btn => {
                btn.addEventListener('click', () => {
                    openCategory(btn.dataset.cat, btn.dataset.title);
                });
            });

            document.getElementById('closeOverlayBtn')?.addEventListener('click', closeCategory);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeCategory();
            });
        });
    </script>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a href="index.html" class="brand">
                <img src="avatar.png" alt="WN/OLD STORE" class="brand-avatar" onerror="this.style.display='none'">
                <div>
                    <div class="brand-name">WN/OLD STORE</div>
                    <div class="brand-sub">← На главную</div>
                </div>
            </a>

            <button class="theme-btn" id="themeToggle" type="button">
                <span class="icon">🌙</span>
                <span>Тема</span>
            </button>
        </header>

        <h1 class="page-title">меню</h1>

        <nav class="tiles-grid">
            <button type="button" class="tile tile-wide" data-cat="games" data-title="Игры">
                <div class="tile-top">
                    <img src="Logo44 (1).png" alt="" class="tile-icon" onerror="this.style.display='none'">
                    <span class="tile-badge">APPX / XAP</span>
                </div>
                <div>
                    <div class="tile-name">Игры</div>
                    <div class="tile-desc">Minecraft, Rider 3D, Doodle Jump и др.</div>
                </div>
            </button>

            <button type="button" class="tile" data-cat="inst" data-title="Инструменты и банки">
                <div class="tile-top">
                    <img src="Logo44 (1).png" alt="" class="tile-icon" onerror="this.style.display='none'">
                    <span class="tile-badge">TOOLS</span>
                </div>
                <div>
                    <div class="tile-name">Инструменты</div>
                    <div class="tile-desc">Реестр, банки, утилиты</div>
                </div>
            </button>

            <button type="button" class="tile" data-cat="social" data-title="Социальные сети">
                <div class="tile-top">
                    <img src="Logo44 (1).png" alt="" class="tile-icon" onerror="this.style.display='none'">
                    <span class="tile-badge">SOCIAL</span>
                </div>
                <div>
                    <div class="tile-name">Соцсети</div>
                    <div class="tile-desc">Telegram, ВК, WhatsApp, 4PDA</div>
                </div>
            </button>

            <button type="button" class="tile tile-dark" data-cat="magaz" data-title="Магазины">
                <div class="tile-name">Магазины</div>
                <div class="tile-desc">MetroStore, OldStore</div>
            </button>

            <button type="button" class="tile tile-dark" data-cat="video" data-title="Видео">
                <div class="tile-name">Видео</div>
                <div class="tile-desc">YouTube, Rutube, MetroTube</div>
            </button>

            <button type="button" class="tile tile-dark" data-cat="all" data-title="Все файлы">
                <div class="tile-name">Все файлы</div>
                <div class="tile-desc">Полный список из store.json</div>
            </button>

            <a href="howto.html" class="tile tile-dark">
                <div class="tile-name">Инструкция</div>
                <div class="tile-desc">Как устанавливать пакеты</div>
            </a>
        </nav>

        <footer class="footer">
            © Все права защищены • WriskNuk Corporation • 2026
        </footer>
    </div>

    <!-- Полноэкранный слой каталога поверх меню -->
    <section class="catalog-overlay" id="catalogOverlay" aria-modal="true" role="dialog">
        <div class="overlay-inner">
            <div class="overlay-bar">
                <div class="overlay-title-wrap">
                    <img src="avatar.png" alt="" class="brand-avatar" onerror="this.style.display='none'">
                    <h2 class="overlay-title" id="overlayTitle">игры</h2>
                </div>
                <button type="button" class="close-btn" id="closeOverlayBtn" aria-label="Закрыть">✕</button>
            </div>

            <div class="apps-list" id="appsList"></div>
        </div>
    </section>
</body>
</html>
