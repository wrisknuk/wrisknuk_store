<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP & WM10 Archive</title>
    <link rel="icon" type="image/png" href="avatar.png">
    <link rel="apple-touch-icon" href="avatar.png">
</head>
       
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --sub-color: #aaaaaa;
            --border-color: #5133ab;
            --info-bg: rgba(17, 17, 17, 0.75);
            --tile-purple: rgba(81, 51, 171, 0.75);
        }
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #000000;
            --sub-color: #555555;
            --border-color: #5133ab;
            --info-bg: rgba(243, 243, 243, 0.75);
            --tile-purple: rgba(81, 51, 171, 0.85);
        }

        body { 
            background-color: var(--bg-color); 
            background-image: url('wp_bg.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: var(--text-color); 
            font-family: 'Segoe UI', 'Segoe UI WP', sans-serif; 
            margin: 12px; 
            transition: background 0.2s, color 0.2s; 
        }
        
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; background: rgba(0,0,0,0.4); padding: 5px; box-sizing: border-box; }
        [data-theme="light"] .header-container { background: rgba(255,255,255,0.4); }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .shop-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }
        h1 { color: #5133ab; font-weight: 300; font-size: 20px; margin: 0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        [data-theme="light"] h1 { text-shadow: none; }
        
        .theme-btn { background: #5133ab; border: 2px solid transparent; color: white; padding: 5px 12px; cursor: pointer; font-family: 'Segoe UI'; font-size: 12px; font-weight: 600; }
        .theme-btn:active { background: #3f2687; }

        .subtitle { color: var(--sub-color); font-size: 13px; margin-bottom: 15px; margin-top: 8px; line-height: 1.4; background: rgba(0,0,0,0.3); padding: 3px; display: inline-block; }
        [data-theme="light"] .subtitle { background: rgba(255,255,255,0.3); }

        .grid { display: flex; flex-wrap: wrap; margin-left: -5px; margin-right: -5px; margin-bottom: 20px; }
        
        .tile { 
            background-color: var(--tile-purple);
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            padding: 10px; 
            margin: 5px;
            width: calc(50% - 10px); 
            height: 115px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            text-decoration: none; 
            color: white; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tile:active { opacity: 0.5; }
        .tile-title { font-size: 14px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .tile-os { font-size: 10px; opacity: 0.8; text-align: right; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        
        .tile-tg { background-color: rgba(34, 158, 217, 0.75); }
        .tile-yt { background-color: rgba(255, 0, 0, 0.75); }
        .icon { width: 24px; height: 24px; fill: white; margin-top: 5px; }

        .info-box { background-color: var(--info-bg); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border-left: 4px solid #5133ab; padding: 12px; margin-top: 25px; box-sizing: border-box; }
        .info-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; line-height: 1.4; }
        .info-links a { color: #00b7c3; text-decoration: none; margin-right: 15px; font-size: 13px; font-weight: bold; }
        [data-theme="light"] .info-links a { color: #5133ab; }

        @media (min-width: 600px) {
            .tile { width: 125px; height: 125px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);

        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
