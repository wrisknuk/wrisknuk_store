<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню — WN/OLD STORE</title>
    <link rel="icon" type="image/png" href="avatar.png">
    <link rel="stylesheet" href="style.css">

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        let storeCache = null;

        function syncThemeBtn() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.querySelector('#themeToggle .icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        function esc(s = '') {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function getStoreData() {
            if (storeCache) return storeCache;
            const res = await fetch('store.json', { cache: 'no-store' });
            storeCache = await res.json();
            return storeCache;
        }

        async function openCategory(catId, catName) {
            const overlay = document.getElementById('catalogOverlay');
            const title = document.getElementById('overlayTitle');
            const list = document.getElementById('appsList');

            title.textContent = catName.toLowerCase();
            list.innerHTML = '<div class="empty-msg">Загрузка...</div>';

            overlay.classList.add('open');
            overlay.scrollTop = 0;
            document.body.classList.add('modal-open');

            try {
                const data = await getStoreData();
                const items = (data.apps || []).filter(app =>
                    catId === 'all' || app.category === catId
                );

                if (!items.length) {
                    list.innerHTML = '<div class="empty-msg">В этом разделе пока нет файлов.</div>';
                    return;
                }

                list.innerHTML = items.map(app => {
                    const ext = app.fileType || (String(app.downloadUrl).endsWith('.xap') ? 'xap' : 'appx');
                    return `
                        <article class="app-card">
                            <div class="app-header">
                                <div class="app-title">${esc(app.name)}</div>
                                <div class="app-os">${esc(app.platform)}</div>
                            </div>
                            <div class="app-desc">${esc(app.desc)}</div>
                            <div class="app-method">⚙ ${esc(app.method)}</div>
                            <a href="${esc(app.downloadUrl)}" class="download-btn" target="_blank" rel="noopener">
                                Скачать ${esc(ext)}
                            </a>
                        </article>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-msg">Ошибка загрузки store.json</div>';
            }
        }

        function closeCategory() {
            const overlay = document.getElementById('catalogOverlay');
            overlay.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        document.addEventListener('DOMContentLoaded', () => {
            syncThemeBtn();

            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                syncThemeBtn();
            });

            document.querySelectorAll('[data-cat]').forEach(btn => {
                btn.addEventListener('click', () => {
                    openCategory(btn.dataset.cat, btn.dataset.title);
                });
            });

            document.getElementById('returnMenuBtn')?.addEventListener('click', closeCategory);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeCategory();
            });
        });
    </script>
</head>
